groups:
  - name: deepscout-sli
    interval: 30s
    rules:
      - record: deepscout:http_requests:rate5m
        expr: sum by (environment, service) (rate(http_server_requests_total[5m]))
      - record: deepscout:http_requests:increase5m
        expr: sum by (environment, service) (increase(http_server_requests_total[5m]))
      - record: deepscout:http_errors:ratio5m
        expr: sum by (environment, service) (rate(http_server_requests_total{status_class="5xx"}[5m])) / sum by (environment, service) (rate(http_server_requests_total[5m]))
      - record: deepscout:http_errors:ratio1h
        expr: sum by (environment, service) (rate(http_server_requests_total{status_class="5xx"}[1h])) / sum by (environment, service) (rate(http_server_requests_total[1h]))
      - record: deepscout:http_availability:ratio30d
        expr: 1 - (sum by (environment, service) (rate(http_server_requests_total{status_class="5xx"}[30d])) / sum by (environment, service) (rate(http_server_requests_total[30d])))
      - record: deepscout:http_availability:burn5m
        expr: deepscout:http_errors:ratio5m / 0.001
      - record: deepscout:http_availability:burn1h
        expr: deepscout:http_errors:ratio1h / 0.001
      - record: deepscout:http_duration:p95_10m
        expr: histogram_quantile(0.95, sum by (environment, service, le) (rate(http_server_request_duration_seconds_bucket[10m])))
      - record: deepscout:first_token:p95_10m
        expr: histogram_quantile(0.95, sum by (environment, service, le) (rate(interview_first_token_seconds_bucket[10m])))
      - record: deepscout:job_success:ratio30m
        expr: sum by (environment, service, job_type) (rate(background_jobs_total{outcome="succeeded"}[30m])) / sum by (environment, service, job_type) (rate(background_jobs_total[30m]))
      - record: deepscout:job_duration:p95_30m
        expr: histogram_quantile(0.95, sum by (environment, service, job_type, le) (rate(background_job_duration_seconds_bucket[30m])))
      - record: deepscout:external_errors:ratio10m
        expr: sum by (environment, service, provider) (rate(external_request_duration_seconds_count{outcome!="success"}[10m])) / sum by (environment, service, provider) (rate(external_request_duration_seconds_count[10m]))
