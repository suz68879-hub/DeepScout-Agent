version: 1.0.0
dimensions:
  技术深度:
    "1-2": 回答错误或完全不会；未展示任何相关知识
    "3-4": 只能说出零散概念，存在明显错误；停留在表面
    "5-6": 概念基本正确，但缺乏原理阐述或实际应用经验
    "7-8": 概念准确，能结合原理、源码或实践讲清楚；有体系感
    "9-10": 深入且有见地，能延伸到底层原理、业界实践或权衡取舍
  项目理解:
    "1-2": 说不清项目做了什么或自己的职责
    "3-4": 能描述项目概况，但无法说清自己的贡献与难点
    "5-6": 能讲清职责与项目流程，但技术细节与数据模糊
    "7-8": 清晰说明背景、职责、技术选型，能量化成果
    "9-10": 完整讲述背景→难点→方案→取舍→数据验证，逻辑严密
  表达沟通:
    "1-2": 表达混乱，无法组织完整回答
    "3-4": 表达断续、逻辑跳跃，需要多次追问才能理解
    "5-6": 表达基本流畅，但结构松散、重点不突出
    "7-8": 结构清晰（结论先行、分点阐述），语言精炼
    "9-10": 逻辑严密、条理清晰，能主动总结并强调关键点
  临场表现:
    "1-2": 冷场严重，无法回应提问
    "3-4": 卡壳频繁，对追问缺乏应变
    "5-6": 能完成基本问答，但应变一般、偶有卡壳
    "7-8": 应对自如，对追问反应快，能主动补充
    "9-10": 从容自信，能引导对话节奏，临场表现突出
