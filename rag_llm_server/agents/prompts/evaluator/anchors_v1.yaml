version: 1.0.0
anchors:
  - dimension: 技术深度
    answer: "面试官问 MySQL 索引失效场景。候选人回答：'联合索引要遵循最左前缀，where 条件跳过了索引第一列就没法走索引，还有 like 以百分号开头、对索引列做函数运算、隐式类型转换都会失效。'"
    score: 7
    reason: 覆盖多个失效场景且表述准确，但缺少原理层面的解释（B+ 树有序结构决定索引规则），未达 9-10 档
  - dimension: 项目理解
    answer: "'我在那个商城项目里负责下单模块，用 Redis 做库存预扣，但是具体怎么防超卖、压测多少 QPS 我记不太清了。'"
    score: 4
    reason: 能说出职责与技术点，但技术细节与数据说不清，落在 3-4 档
  - dimension: 表达沟通
    answer: "'首先我觉得这个问题要从两方面看，第一是数据一致性，我们采用了最终一致方案……第二是性能，接口从 200 毫秒优化到 50 毫秒，具体做法是这样……总结一下，这个方案适合我们当时的业务场景。'"
    score: 8
    reason: 结论先行、分点阐述、有量化数据、有总结，结构完整，8 分
  - dimension: 临场表现
    answer: "追问为什么不用 Kafka 时，候选人短暂停顿后说：'这个点我之前没想过，从我们的量级来看 RocketMQ 足够，Kafka 的吞吐优势在千万级消息才会体现，性价比不高。'"
    score: 9
    reason: 面对未准备的追问，快速组织出有逻辑、有依据的回答，临场应变突出
