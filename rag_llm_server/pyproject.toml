[project]
name = "server-python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.16,<2",
    "celery>=5.6,<6",
    "fastapi==0.115.0",
    "httpx==0.27.2",
    "jinja2>=3.1.6",
    "langchain>=1.3.15",
    "langchain-mcp-adapters>=0.3.0",
    "langchain-openai>=1.5.1",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.0,<4",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "llama-index>=0.10.68",
    "llama-index-embeddings-openai>=0.1.11",
    "mcp[cli]>=1.12.4",
    "opentelemetry-api>=1.38,<2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.38,<2",
    "opentelemetry-sdk>=1.38,<2",
    "psycopg[binary,pool]>=3.2,<4",
    "pwdlib[argon2]>=0.3.0",
    "pydantic==2.9.2",
    "pymupdf>=1.28.2",
    "pypdf>=4.3.1",
    "python-dotenv==1.0.1",
    "pyyaml>=6.0.3",
    "redis>=5.2,<7",
    "sqlalchemy[asyncio]>=2.0,<3",
    "sqlglot>=27,<30",
    "tos>=2.9.2",
    "uvicorn[standard]==0.32.0",
    "volcengine-python-sdk[ark]>=5.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
omit = ["tests/*", ".venv/*", "scripts/multi_replica_acceptance.py"]

[tool.coverage.report]
fail_under = 81
show_missing = true
