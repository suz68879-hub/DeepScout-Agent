name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

  frontend-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Unit tests and coverage gate
        run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-lcov
          path: coverage/lcov.info

  backend-coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag_llm_server
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Start PostgreSQL and create isolated CI roles
        shell: bash
        run: |
          sudo systemctl start postgresql.service
          APP_PASSWORD="$(openssl rand -hex 24)"
          MIGRATION_PASSWORD="$(openssl rand -hex 24)"
          ANALYTICS_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$APP_PASSWORD"
          echo "::add-mask::$MIGRATION_PASSWORD"
          echo "::add-mask::$ANALYTICS_PASSWORD"
          sudo -u postgres psql \
            --set=app_password="$APP_PASSWORD" \
            --set=migration_password="$MIGRATION_PASSWORD" \
            --set=analytics_password="$ANALYTICS_PASSWORD" <<'SQL'
          CREATE ROLE deepscout_app LOGIN PASSWORD :'app_password';
          CREATE ROLE deepscout_migration LOGIN PASSWORD :'migration_password';
          CREATE ROLE deepscout_analytics LOGIN PASSWORD :'analytics_password';
          CREATE DATABASE deepscout_test OWNER deepscout_migration;
          SQL
          {
            echo "APP_ENV=test"
            echo "STORAGE_BACKEND=postgres"
            echo "DATABASE_URL=postgresql+psycopg://deepscout_app:${APP_PASSWORD}@127.0.0.1:5432/deepscout_test"
            echo "MIGRATION_DATABASE_URL=postgresql+psycopg://deepscout_migration:${MIGRATION_PASSWORD}@127.0.0.1:5432/deepscout_test"
            echo "ANALYTICS_DATABASE_URL=postgresql+psycopg://deepscout_analytics:${ANALYTICS_PASSWORD}@127.0.0.1:5432/deepscout_test"
          } >> "$GITHUB_ENV"

      - name: Install dependencies
        run: uv sync --dev

      - name: Upgrade PostgreSQL schema
        run: uv run alembic upgrade head

      - name: Backend tests and coverage gate
        run: uv run pytest --cov=. --cov-report=term-missing --cov-report=xml:coverage.xml -q

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-cobertura
          path: rag_llm_server/coverage.xml

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run e2e
